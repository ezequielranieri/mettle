name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12

      - name: Tests
        run: go test ./...

      - name: Eval gate (deterministic, no API keys)
        run: |
          go run ./cmd/mettle run \
            --spec examples/scenarios/empty-states.yaml \
            --store /tmp/ci-eval.db \
            --traces /tmp/ci-traces \
            --report /tmp/ci-report.md
          go run ./cmd/mettle run \
            --spec examples/scenarios/security.yaml \
            --store /tmp/ci-eval-security.db \
            --traces /tmp/ci-security-traces \
            --report /tmp/ci-security-report.md
          go run ./cmd/mettle run \
            --spec examples/scenarios/protocols.yaml \
            --store /tmp/ci-eval-protocols.db \
            --traces /tmp/ci-protocols-traces \
            --report /tmp/ci-protocols-report.md
          go run ./cmd/mettle run \
            --spec examples/scenarios/adversarial.yaml \
            --store /tmp/ci-eval-adversarial.db \
            --traces /tmp/ci-adversarial-traces \
            --report /tmp/ci-adversarial-report.md